<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icons for ilo sitelen</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; background: #f5ecd7; color: #121110; }
  main { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 0.85rem; }
  canvas { max-width: 256px; height: auto; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  p { max-width: 70ch; }
  output { display: none; }
</style>
</head>
<body>
<!--
  Draws the app icons in the app's own look: the mark from the top bar, an ink frame around a cream tile with the ilo glyph
  inside. The tile is the iOS home screen shape, a rounded square with continuous corners, so the frame keeps an even width
  after iOS cuts the icon to that shape. The glyph is stroked a little so its monoline sits at the weight of the app's 3px lines.
  Chosen on 2026-11-02 from six candidates compared on mock home screens (frameless paper, ochre with and without the frame,
  the dark-mode mark, and the mark as a sticker on ochre were the others).
  - icon-192.png, icon-512.png: the mark with transparent corners, shown as-is by desktop browsers.
  - apple-touch-icon.png: full-bleed, ink to the edge and the cream tile inset by the frame width; iOS rounds it itself.
  - icon-maskable-512.png: full-bleed cream, the glyph alone inside the safe zone, for Android launchers to shape.
  The sitelen pona font is read out of ../index.html so it stays single-sourced. fetch() does not work over file://, so run
  from the repo root with `python3 -m http.server` and open http://localhost:8000/scripts/icons.html, then save each PNG into icons/.
  scripts/ is excluded from the deployment by .vercelignore.
-->
<h1>icons</h1>
<p id="status">Drawing…</p>
<main id="main"></main>
<script>
(async () => {
  const status = document.getElementById("status");
  try {
    const html = await (await fetch("../index.html")).text();
    const m = html.match(/font-family:'NasinNanpa';src:url\((data:font\/woff2;base64,[A-Za-z0-9+/=]+)\)/);
    if (!m) throw new Error("NasinNanpa data URI not found in ../index.html");
    const nasin = new FontFace("NasinNanpa", `url(${m[1]})`);
    document.fonts.add(await nasin.load());
    await document.fonts.ready;

    const PAPER = "#f5ecd7", INK = "#121110";
    const IOS_R = 0.2237; // the corner radius of an iOS icon, as a share of its side
    const rad = (deg) => deg * Math.PI / 180;

    // The iOS icon shape: a rounded square whose corners run into the sides without a kink (Figma's corner smoothing, 0.6
    // for iOS). The same construction as the figma-squircle package, as a Path2D.
    function squircle(x, y, w, h, r, s = 0.6) {
      const budget = Math.min(w, h) / 2;
      let sm = s, p = (1 + s) * r;
      if (p > budget) { sm = Math.min(s, budget / r - 1); p = Math.min(p, budget); }
      const arc = 90 * (1 - sm);
      const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
      const alpha = (90 - arc) / 2;
      const p34 = r * Math.tan(rad(alpha / 2));
      const beta = 45 * sm;
      const c = p34 * Math.cos(rad(beta));
      const d = c * Math.tan(rad(beta));
      const b = (p - L - c - d) / 3, a = 2 * b;
      return new Path2D([
        `M ${x + w - p} ${y}`,
        `c ${a} 0 ${a + b} 0 ${a + b + c} ${d}`, `a ${r} ${r} 0 0 1 ${L} ${L}`, `c ${d} ${c} ${d} ${b + c} ${d} ${a + b + c}`,
        `L ${x + w} ${y + h - p}`,
        `c 0 ${a} 0 ${a + b} ${-d} ${a + b + c}`, `a ${r} ${r} 0 0 1 ${-L} ${L}`, `c ${-c} ${d} ${-(b + c)} ${d} ${-(a + b + c)} ${d}`,
        `L ${x + p} ${y + h}`,
        `c ${-a} 0 ${-(a + b)} 0 ${-(a + b + c)} ${-d}`, `a ${r} ${r} 0 0 1 ${-L} ${-L}`, `c ${-d} ${-c} ${-d} ${-(b + c)} ${-d} ${-(a + b + c)}`,
        `L ${x} ${y + p}`,
        `c 0 ${-a} 0 ${-(a + b)} ${d} ${-(a + b + c)}`, `a ${r} ${r} 0 0 1 ${L} ${-L}`, `c ${c} ${-d} ${b + c} ${-d} ${a + b + c} ${-d}`,
        "Z",
      ].join(" "));
    }

    const SPECS = [
      { name: "icon-192.png", size: 192, shape: "mark" },
      { name: "icon-512.png", size: 512, shape: "mark" },
      { name: "apple-touch-icon.png", size: 180, shape: "apple" },
      { name: "icon-maskable-512.png", size: 512, shape: "maskable" },
    ];
    const urls = {};
    for (const spec of SPECS) {
      const S = spec.size;
      const c = document.createElement("canvas"); c.width = S; c.height = S;
      const g = c.getContext("2d");
      const BW = S * 0.08; // the frame: the app's 3px line on a 34px mark, scaled
      // The ilo glyph, centred on the tile by its ink box, with a stroke of `bold` around the monoline.
      const glyph = (px, bold) => {
        g.font = `${px}px NasinNanpa`; g.textBaseline = "alphabetic";
        const mt = g.measureText("ilo");
        const w = mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight, h = mt.actualBoundingBoxAscent + mt.actualBoundingBoxDescent;
        const x = (S - w) / 2 + mt.actualBoundingBoxLeft, y = (S - h) / 2 + mt.actualBoundingBoxAscent;
        g.lineWidth = bold; g.strokeStyle = INK; g.lineJoin = "round"; g.lineCap = "round"; g.strokeText("ilo", x, y);
        g.fillStyle = INK; g.fillText("ilo", x, y);
      };
      // The cream tile inset by the frame width; the ink behind it shows as the frame.
      const tile = () => { g.fillStyle = PAPER; g.fill(squircle(BW, BW, S - 2 * BW, S - 2 * BW, S * IOS_R - BW)); };
      if (spec.shape === "mark") {
        // The mark itself: ink in the iOS shape, the tile on it, transparent corners.
        g.fillStyle = INK; g.fill(squircle(0, 0, S, S, S * IOS_R));
        tile(); glyph(S * 0.58, S * 0.03);
      } else if (spec.shape === "apple") {
        // iOS cuts the icon to its shape itself, so the ink runs to the edge and only the tile is drawn in the shape.
        g.fillStyle = INK; g.fillRect(0, 0, S, S);
        tile(); glyph(S * 0.58, S * 0.03);
      } else {
        // Maskable: the launcher cuts its own shape and keeps the middle 80%, so only the glyph, kept well inside.
        g.fillStyle = PAPER; g.fillRect(0, 0, S, S);
        glyph(S * 0.38, S * 0.02);
      }
      const url = c.toDataURL("image/png"); urls[spec.name] = url;
      const fig = document.createElement("figure");
      fig.append(c);
      const cap = document.createElement("figcaption");
      cap.innerHTML = `<a download="${spec.name}" href="${url}">${spec.name}</a> ${S}×${S}`;
      fig.append(cap);
      document.getElementById("main").append(fig);
    }
    window.ICON_URLS = urls;
    status.textContent = "Done. Save each PNG into icons/.";
  } catch (e) {
    status.textContent = "Failed: " + e.message;
  }
})();
</script>
</body>
</html>
