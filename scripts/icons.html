<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icons for ilo sitelen</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; background: #f5ecd7; color: #121110; }
  main { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 0.85rem; }
  canvas { max-width: 256px; height: auto; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  p { max-width: 70ch; }
  output { display: none; }
</style>
</head>
<body>
<!--
  Draws the app icons in the app's own look: the mark, an ink outline around a cream tile with the ilo glyph inside.
  - icon-192.png, icon-512.png: the mark as a rounded square with transparent corners, shown as-is by desktop browsers.
  - apple-touch-icon.png: full-bleed cream with the outline inset, so iOS's own rounding leaves a bordered tile.
  - icon-maskable-512.png: full-bleed cream, the glyph alone inside the safe zone, for Android launchers to shape.
  The sitelen pona font is read out of ../index.html so it stays single-sourced. fetch() does not work over file://, so run
  from the repo root with `python3 -m http.server` and open http://localhost:8000/scripts/icons.html, then save each PNG into icons/.
  scripts/ is excluded from the deployment by .vercelignore.
-->
<h1>icons</h1>
<p id="status">Drawing…</p>
<main id="main"></main>
<script>
(async () => {
  const status = document.getElementById("status");
  try {
    const html = await (await fetch("../index.html")).text();
    const m = html.match(/font-family:'NasinNanpa';src:url\((data:font\/woff2;base64,[A-Za-z0-9+/=]+)\)/);
    if (!m) throw new Error("NasinNanpa data URI not found in ../index.html");
    const nasin = new FontFace("NasinNanpa", `url(${m[1]})`);
    document.fonts.add(await nasin.load());
    await document.fonts.ready;

    const PAPER = "#f5ecd7", INK = "#121110";
    const SPECS = [
      { name: "icon-192.png", size: 192, shape: "mark" },
      { name: "icon-512.png", size: 512, shape: "mark" },
      { name: "apple-touch-icon.png", size: 180, shape: "apple" },
      { name: "icon-maskable-512.png", size: 512, shape: "maskable" },
    ];
    const urls = {};
    for (const spec of SPECS) {
      const S = spec.size;
      const c = document.createElement("canvas"); c.width = S; c.height = S;
      const g = c.getContext("2d");
      const glyph = (px) => {
        const font = `${px}px NasinNanpa`;
        g.font = font; g.fillStyle = INK; g.textBaseline = "alphabetic";
        const mt = g.measureText("ilo");
        const h = mt.fontBoundingBoxAscent + mt.fontBoundingBoxDescent;
        g.fillText("ilo", (S - mt.width) / 2, (S - h) / 2 + mt.fontBoundingBoxAscent);
      };
      if (spec.shape === "mark") {
        // The mark itself: cream rounded square, ink outline on its edge, transparent corners.
        const sw = S * 0.07, r = S * 0.24;
        g.beginPath(); g.roundRect(sw / 2, sw / 2, S - sw, S - sw, r);
        g.fillStyle = PAPER; g.fill();
        g.lineWidth = sw; g.strokeStyle = INK; g.stroke();
        glyph(S * 0.55);
      } else if (spec.shape === "apple") {
        // iOS rounds the corners itself (about 22% of the size), so the outline sits a little in from the edge.
        g.fillStyle = PAPER; g.fillRect(0, 0, S, S);
        const inset = S * 0.06, sw = S * 0.06, r = S * 0.165;
        g.beginPath(); g.roundRect(inset + sw / 2, inset + sw / 2, S - 2 * inset - sw, S - 2 * inset - sw, r);
        g.lineWidth = sw; g.strokeStyle = INK; g.stroke();
        glyph(S * 0.5);
      } else {
        // Maskable: the launcher cuts its own shape and keeps the middle 80%, so only the glyph, kept well inside.
        g.fillStyle = PAPER; g.fillRect(0, 0, S, S);
        glyph(S * 0.38);
      }
      const url = c.toDataURL("image/png"); urls[spec.name] = url;
      const fig = document.createElement("figure");
      fig.append(c);
      const cap = document.createElement("figcaption");
      cap.innerHTML = `<a download="${spec.name}" href="${url}">${spec.name}</a> ${S}×${S}`;
      fig.append(cap);
      document.getElementById("main").append(fig);
    }
    window.ICON_URLS = urls;
    status.textContent = "Done. Save each PNG into icons/.";
  } catch (e) {
    status.textContent = "Failed: " + e.message;
  }
})();
</script>
</body>
</html>
